name: Đóng gói APK Capsule VN

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag phát hành (vd: v1.3.0). Để trống nếu chỉ đóng gói thử"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Biên dịch & Đóng gói APK
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Khởi tạo Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Nạp khóa ký cố định (để cập nhật OTA cài đè được)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/capsule.jks"
            echo "CAPSULE_KEYSTORE=$RUNNER_TEMP/capsule.jks" >> "$GITHUB_ENV"
            echo "Đã nạp khóa ký cố định."
          else
            echo "::warning::Chưa có secret KEYSTORE_BASE64 — APK được ký bằng khóa debug ngẫu nhiên, KHÔNG cập nhật OTA cài đè được."
          fi

      - name: Đóng gói APK Capsule VN
        env:
          CAPSULE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CAPSULE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CAPSULE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Capsule_VN-debug.apk
          # Phát hành bản release (R8, không gỡ lỗi) khi đã ký bằng khóa cố định; chưa có khóa thì dùng bản debug như cũ
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/Capsule_VN.apk
            echo "Phát hành bản release đã tối ưu."
          else
            cp out/Capsule_VN-debug.apk out/Capsule_VN.apk
            echo "::warning::Không có khóa ký -> phát hành bản debug."
          fi
          ls -l out

      - name: Tải lên file APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capsule_VN
          path: out/*.apk
          retention-days: 90

  smoke:
    name: Chạy thử trên máy ảo Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Lấy APK vừa đóng gói
        uses: actions/download-artifact@v4
        with:
          name: Capsule_VN
          path: out

      - name: Bật tăng tốc KVM cho máy ảo
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Mở app, bật Viên thuốc, gửi tin thử, đo RAM, bắt lỗi crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/smoke.sh

      - name: Lưu ảnh chụp & nhật ký chạy thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: smoke/
          retention-days: 14

  release:
    name: Phát hành
    needs: [ build, smoke ]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Lấy APK vừa đóng gói
        uses: actions/download-artifact@v4
        with:
          name: Capsule_VN
          path: out

      - name: Cập nhật bản phát hành GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          case "$TAG" in v[0-9]*) ;; *) echo "Tag không hợp lệ: $TAG"; exit 1 ;; esac
          # Ghi chú phát hành lấy từ đúng mục phiên bản trong CHANGELOG.md (hiện trong "Có gì mới" của app)
          VER="${TAG#v}"
          awk -v v="## v$VER" 'index($0, v) == 1 {on=1; next} /^## v/ && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Capsule VN $TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Capsule_VN.apk --clobber
          else
            gh release create "$TAG" out/Capsule_VN.apk \
              --target "$GITHUB_SHA" \
              --title "Capsule VN $TAG" \
              --notes-file notes.md
          fi
