name: Đóng gói APK Capsule VN

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Biên dịch & Đóng gói APK
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Khởi tạo Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Đóng gói APK Capsule VN
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/Capsule_VN.apk

      - name: Tải lên file APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capsule_VN
          path: out/Capsule_VN.apk
          retention-days: 90

      - name: Cập nhật bản phát hành GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/Capsule_VN.apk --clobber
          else
            gh release create "$TAG" out/Capsule_VN.apk \
              --title "Capsule VN $TAG" \
              --generate-notes
          fi
